# Optional local hooks that run the fast part of CI before a commit is made.
#
#   python3 -m pip install pre-commit
#   pre-commit install
#
# The local hooks run under the Python that pre-commit itself runs under, in an environment of
# their own, so that interpreter must be 3.11 or newer (the stock python3 on some machines is 3.9).
#
# CI remains the authority: these hooks are the same checks, run earlier, and a commit made with
# --no-verify is still caught by the lint, unit-tests and checkers jobs. They stay fast on
# purpose (seconds). The slow work (the full suite, the PDF builds, the full release gate) is
# left to tools/run_ci_locally.sh.
#
# ruff here is the lint job's own check, with ruff.toml. It never fixes anything on its own,
# because a linter must not edit a hash-pinned file under model/.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check

  - repo: local
    hooks:
      # The canonical model's SHA-256, the room capacity and the 118-value decomposition: the
      # release identity. Editing model/aa_group_model.py fails here before it reaches a push.
      - id: release-invariants
        name: the canonical model is unchanged
        entry: python -m pytest tests/test_release_invariants.py -q -p no:cacheprovider
        language: python
        additional_dependencies: [pytest, numpy]
        pass_filenames: false
        files: ^(model/aa_group_model\.py|tests/test_release_invariants\.py)$

      # No tracked file may carry a machine-specific absolute path.
      - id: portability
        name: no machine-specific paths
        entry: python tools/check_portability.py
        language: python
        pass_filenames: false

      # Every number a document states about the repository against the tree it describes.
      - id: docs-match-tree
        name: documentation matches the tree
        entry: python tools/check_docs.py
        language: python
        pass_filenames: false

      # Corpus records and verification indexes against the source files, and the withheld
      # name against every index.
      - id: corpus-drift
        name: the source corpus has not drifted
        entry: python tools/build_corpus.py --check
        language: python
        pass_filenames: false
