name: CI

# Two jobs on purpose.
#
# `checks` is the fast one and gates every push and pull request: unit tests for the
# canonical model at 100 per cent coverage, plus every checker that does not need a
# TeX toolchain. It runs in under a minute and needs nothing but Python and numpy.
#
# `release-gate` is the slow one. It installs pandoc and tectonic, rebuilds the book
# and the primer, and then runs the fail-closed release gate. It has to rebuild rather
# than trust the committed PDFs, because a fresh clone gives every file the same
# checkout timestamp and the gate legitimately requires each artifact to be at least
# as new as its sources.
#
# No source document is present in CI. Every source in `research/incorporated/` is
# git-ignored by design, and the citation checker is built to work from the committed
# verification indexes alone. If CI ever starts failing for want of a document, the
# fault is in the checker, not in the absence of the document.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and checkers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Unit tests, with the 100 per cent coverage gate on the canonical model
        run: python -m pytest --cov --cov-report=term-missing

      - name: Confirm the canonical model hash
        run: |
          python - <<'PY'
          import hashlib, pathlib, sys
          expected = "c3823f72cabd454a778464a5a31c13fd09161f2a533b95b315ce833c7add3952"
          digest = hashlib.sha256(pathlib.Path("model/aa_group_model.py").read_bytes()).hexdigest()
          print("model sha256:", digest)
          sys.exit(0 if digest == expected else "model hash changed; see CLAUDE.md")
          PY

      - name: Corpus has no drift
        run: python tools/build_corpus.py --check

      - name: Portability
        run: python tools/check_portability.py

      - name: Book-level checks
        run: python tools/check_book.py

  release-gate:
    name: Release gate with rendered artifacts
    runs-on: ubuntu-latest
    # The gate is the shippability question, not the correctness question. Run it on
    # main and on demand rather than on every pull-request push.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Both halves of this reach the network and both have stalled in practice. The
      # observed failure is the runner's Azure apt mirror going unreachable: apt logs a
      # column of "Ign:" lines, falls back to archive.ubuntu.com, and takes minutes about
      # it. Retrying made that worse, because it repeated a slow operation rather than a
      # fast failure. So point apt at the mirror that answers, bound every request, and
      # do not retry the update.
      - name: Install pandoc, tectonic, and the TeX Gyre fonts
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          timeout 300 sudo -E apt-get update \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15
          timeout 300 sudo -E apt-get install -y --no-install-recommends \
            pandoc fonts-texgyre
          for attempt in 1 2 3; do
            if timeout 120 curl -fsSL --retry 2 --retry-delay 3 \
                 https://drop-sh.fullyjustified.net | sh; then
              break
            fi
            echo "tectonic download failed, attempt $attempt"
            sleep 5
          done
          sudo mv tectonic /usr/local/bin/
          fc-cache -f
          pandoc --version | head -1
          tectonic --version

      # Both builds ask fontspec for "TeX Gyre Pagella" by name, which is a fontconfig
      # lookup and not something tectonic can supply from its bundle. Fail here, with a
      # clear message, rather than forty lines deep in a XeTeX transcript.
      - name: The book font must be visible to fontconfig
        run: |
          fc-list | grep -qi 'TeX Gyre Pagella' \
            || { echo 'TeX Gyre Pagella not installed; the PDF builds will fail'; exit 1; }
          echo "found: $(fc-list | grep -ci 'TeX Gyre Pagella') TeX Gyre Pagella faces"

      # The gate requires each derived report to be at least as new as every cache it
      # summarises. A fresh clone gives every file the same checkout timestamp, so the
      # reports have to be regenerated here rather than trusted, exactly as the
      # reproduction sequence in README.md does before the release check. All three read
      # existing caches and take well under a second; none of them recomputes anything.
      - name: Regenerate the derived reports
        run: |
          python tools/inventory_model_choices.py
          python tools/summarize_release_gate.py
          python tools/summarize_robustness.py

      # All three artifacts, for the same reason: the gate requires each to be at least as
      # new as its sources, and a fresh clone gives them all one timestamp. The paper is
      # LaTeX and its header documents two pdflatex passes, which is what latexmk performs
      # locally; tectonic resolves the passes itself and is already installed here.
      - name: Rebuild the primer, the book, and the paper
        timeout-minutes: 20
        run: |
          python tools/build_primer.py
          python tools/build_book.py
          cd paper && tectonic anonymity-as-an-aggregation-condition.tex

      - name: No text may sit outside the type block
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, sys
          SOURCES = {"book": "build/nobody-in-charge.md",
                     "primer": "reference/PRIMER-steps-and-traditions.md"}
          EXTRA = {"book": ["--top-level-division=chapter"]}
          bad = False
          for name, log in (("book", "build/pandoc.log"),
                            ("primer", "build/primer-pandoc.log")):
              path = pathlib.Path(log)
              if not path.exists():
                  continue
              lines = path.read_text(errors="ignore").splitlines()
              idx = [i for i, line in enumerate(lines)
                     if re.search(r"Overfull .hbox \(\d+\.?\d*pt", line)]
              hits = sorted({lines[i].strip() for i in idx})
              print(f"{name}: {len(hits)} overfull boxes")
              for hit in hits:
                  print("    " + hit)
              # TeX prints the text it could not fit on the lines after the warning.
              # That is the only source that names the offending box directly.
              for i in idx[:2]:
                  print("    log context:")
                  for line in lines[i:i + 10]:
                      print("        " + line[:160])
              # Resolve each warning back to the source line that caused it. TeX names a
              # line in the LaTeX it was handed, which is thrown away after the run, so
              # regenerate it with the same pandoc and quote the line. Without this the
              # warning names a line number in a file nobody can look at.
              if hits and name in SOURCES:
                  tex = pathlib.Path(f"build/{name}-resolved.tex")
                  subprocess.run(["pandoc", SOURCES[name], "-s", "-t", "latex",
                                  *EXTRA.get(name, []), "-o", str(tex)], check=False)
                  if tex.exists():
                      src = tex.read_text(errors="ignore").splitlines()
                      for hit in hits:
                          for num in {int(n) for n in re.findall(r":(\d+):", hit)}:
                              print(f"    --> {tex}:{num}")
                              for k in range(max(0, num - 2), min(len(src), num + 1)):
                                  print(f"        {k + 1}: {src[k][:200]}")
                              # The column spec decides the row width. Content changes
                              # that leave a deficit bit-identical mean the geometry is at
                              # fault, so print the spec and the sum of its fractions.
                              b = next((j for j in range(num - 1, -1, -1)
                                        if "begin{longtable}" in src[j]), None)
                              if b is not None:
                                  spec = []
                                  for j in range(b, min(len(src), b + 16)):
                                      spec.append(src[j])
                                      if src[j].lstrip().startswith("\\toprule"):
                                          break
                                  print("    spec at line %d:" % (b + 1))
                                  for line in spec:
                                      print("        " + line[:160])
                                  fr = [float(x) for x in
                                        re.findall(r"real\{([0-9.]+)\}", "\n".join(spec))]
                                  if fr:
                                      print("        fractions sum to %.4f over %d columns"
                                            % (sum(fr), len(fr)))
                                  head = "\n".join(src[:400])
                                  for probe in ("ragged2e", "nictabragged",
                                                "RaggedRight"):
                                      print("        preamble has %-14s %s"
                                            % (probe, probe in "\n".join(src)))
                                  print("    rows after the offending line:")
                                  for k in range(num, min(len(src), num + 10)):
                                      print("        " + src[k][:120])
              bad |= bool(hits)
          sys.exit(1 if bad else 0)
          PY

      - name: Release gate and the slow integration tests
        env:
          NIC_SLOW_TESTS: "1"
        run: |
          python tools/check_release.py
          python -m pytest tests/test_tools_integration.py
