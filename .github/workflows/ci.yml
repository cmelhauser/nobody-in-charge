name: CI

# Two jobs on purpose.
#
# `checks` is the fast one and gates every push and pull request: unit tests for the
# canonical model at 100 per cent coverage, plus every checker that does not need a
# TeX toolchain. It runs in under a minute and needs nothing but Python and numpy.
#
# `release-gate` is the slow one. It installs pandoc and tectonic, rebuilds the book
# and the primer, and then runs the fail-closed release gate. It has to rebuild rather
# than trust the committed PDFs, because a fresh clone gives every file the same
# checkout timestamp and the gate legitimately requires each artifact to be at least
# as new as its sources.
#
# No source document is present in CI. Every source in `research/incorporated/` is
# git-ignored by design, and the citation checker is built to work from the committed
# verification indexes alone. If CI ever starts failing for want of a document, the
# fault is in the checker, not in the absence of the document.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and checkers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Unit tests, with the 100 per cent coverage gate on the canonical model
        run: python -m pytest --cov --cov-report=term-missing

      - name: Confirm the canonical model hash
        run: |
          python - <<'PY'
          import hashlib, pathlib, sys
          expected = "c3823f72cabd454a778464a5a31c13fd09161f2a533b95b315ce833c7add3952"
          digest = hashlib.sha256(pathlib.Path("model/aa_group_model.py").read_bytes()).hexdigest()
          print("model sha256:", digest)
          sys.exit(0 if digest == expected else "model hash changed; see CLAUDE.md")
          PY

      - name: Corpus has no drift
        run: python tools/build_corpus.py --check

      - name: Portability
        run: python tools/check_portability.py

      - name: Book-level checks
        run: python tools/check_book.py

  release-gate:
    name: Release gate with rendered artifacts
    runs-on: ubuntu-latest
    # The gate is the shippability question, not the correctness question. Run it on
    # main and on demand rather than on every pull-request push.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install pandoc, tectonic, and the TeX Gyre fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc fonts-texgyre
          curl -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
          fc-cache -f
          pandoc --version | head -1
          tectonic --version

      # Both builds ask fontspec for "TeX Gyre Pagella" by name, which is a fontconfig
      # lookup and not something tectonic can supply from its bundle. Fail here, with a
      # clear message, rather than 40 lines deep in a XeTeX transcript.
      - name: The book font must be visible to fontconfig
        run: |
          fc-list | grep -qi 'TeX Gyre Pagella' \
            || { echo 'TeX Gyre Pagella not installed; the PDF builds will fail'; exit 1; }
          echo "found: $(fc-list | grep -ci 'TeX Gyre Pagella') TeX Gyre Pagella faces"

      - name: Rebuild the primer and the book
        run: |
          python tools/build_primer.py
          python tools/build_book.py

      - name: No text may sit outside the type block
        run: |
          python - <<'PY'
          import pathlib, re, sys
          bad = False
          for name, log in (("book", "build/pandoc.log"),
                            ("primer", "build/primer-pandoc.log")):
              path = pathlib.Path(log)
              if not path.exists():
                  continue
              lines = path.read_text(errors="ignore").splitlines()
              hits = [i for i, line in enumerate(lines)
                      if re.search(r"Overfull .hbox \(\d+\.?\d*pt", line)]
              print(f"{name}: {len(hits)} overfull boxes")
              # Print the offending line and the text TeX could not fit. A bare count
              # cannot be acted on, and the log dies with the runner.
              for i in hits:
                  for line in lines[i:i + 4]:
                      print("    " + line)
                  print()
              bad |= bool(hits)
          sys.exit(1 if bad else 0)
          PY

      - name: Release gate and the slow integration tests
        env:
          NIC_SLOW_TESTS: "1"
        run: |
          python tools/check_release.py
          python -m pytest tests/test_tools_integration.py
