name: CI

# Two jobs, split by what they can verify without a network.
#
# `checks` gates every push and pull request. It needs Python and pip and nothing else,
# and it runs every check that does not require a rendered PDF: the test suite with its
# coverage gate, the model hash, corpus drift, portability, the book-level checks, and
# 131 of the 136 release-gate checks. It has never failed for an environmental reason.
#
# `documents` renders the three PDFs. It needs pandoc, a TeX engine and a font, so it
# reaches the network three times, and that is where every environmental failure in this
# repository's history has come from: a hung apt mirror, a CTAN mirror timing out, a
# certificate that would not verify, and four separate cold-cache fetches inside tectonic.
# Its toolchain is therefore cached, pinned where pinning is possible, and bounded so a
# dead host costs seconds. It runs on main and on demand, not on pull requests.
#
# The split matters more than either job. Before it, a CTAN timeout meant none of the
# release checks ran at all, because they lived behind the toolchain. They no longer do.
#
# No source document is present in CI. Every source under `research/incorporated/` is
# git-ignored by design and the citation checker works from the committed verification
# indexes alone. If CI ever fails for want of a document, the fault is in the checker.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned because pandoc computes the column widths of every table in the book and does
  # not compute them the same way across versions. An unpinned runner once gave the
  # paper's scenario table a first column of 0.1154 where 3.10.2 gives 0.2577, which put
  # a row outside the type block. Raise deliberately and re-read the PDFs.
  PANDOC_VERSION: "3.10.2"
  # Both caches live inside the workspace rather than under the runner's home directory,
  # so no path in this file is home-relative. tools/check_portability.py enforces that
  # across every tracked file and does not make an exception for CI.
  TECTONIC_CACHE_DIR: ${{ github.workspace }}/.tex-cache
  XDG_DATA_HOME: ${{ github.workspace }}/.xdg

jobs:
  checks:
    name: Tests and checkers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Unit tests, with the 100 per cent coverage gate on the canonical model
        run: python -m pytest --cov --cov-report=term-missing

      - name: Confirm the canonical model hash
        run: |
          python - <<'PY'
          import hashlib, pathlib, sys
          expected = "c3823f72cabd454a778464a5a31c13fd09161f2a533b95b315ce833c7add3952"
          digest = hashlib.sha256(pathlib.Path("model/aa_group_model.py").read_bytes()).hexdigest()
          print("model sha256:", digest)
          sys.exit(0 if digest == expected else "model hash changed; see CLAUDE.md")
          PY

      - name: Corpus has no drift
        run: python tools/build_corpus.py --check

      - name: Portability
        run: python tools/check_portability.py

      - name: Book-level checks
        run: python tools/check_book.py

      # Everything the release gate can decide without a rendered PDF: cache existence and
      # completeness, model and script hash currency, the registered design counts, and the
      # model invariants. The seven artifact-freshness checks are omitted here because a
      # fresh clone gives every file one timestamp, so they can only be satisfied by
      # building an artifact and then asserting it is newer than its input. The `documents`
      # job runs the full gate.
      - name: Release gate, less the rendered artifacts
        run: python tools/check_release.py --skip-artifacts

  documents:
    name: Rendered documents
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Tectonic fetches TeX support files on demand and has failed four times on a cold
      # cache. Caching the bundle removes that failure mode after the first successful run
      # rather than retrying through it.
      - name: Cache the TeX toolchain
        uses: actions/cache@v4
        with:
          path: |
            .tex-cache
            .xdg
          key: tex-${{ runner.os }}-${{ env.PANDOC_VERSION }}-v2

      - name: Install pandoc, tectonic and the book font
        run: |
          set -euo pipefail

          curl -fsSL --retry 3 --retry-delay 3 --connect-timeout 10 -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb

          # Explicit mirrors, not the CTAN redirector, which once sent a runner to a host
          # whose certificate would not verify. Short connect timeout and no inner retry:
          # the loop over mirrors is the retry, so retrying inside it multiplies a dead
          # host's cost. Each file is checked for the OpenType magic, so an error page
          # cannot masquerade as a font.
          mkdir -p "$XDG_DATA_HOME/fonts"
          MIRRORS="https://ftp.fau.de/ctan/fonts/tex-gyre/opentype
                   https://mirrors.ctan.org/fonts/tex-gyre/opentype
                   https://ctan.math.illinois.edu/fonts/tex-gyre/opentype"
          for face in regular italic bold bolditalic; do
            dest="$XDG_DATA_HOME/fonts/texgyrepagella-$face.otf"
            if [ -s "$dest" ] && [ "$(head -c 4 "$dest" | tr -d '\0')" = "OTTO" ]; then
              continue                      # restored from cache
            fi
            got=""
            for base in $MIRRORS; do
              if curl -fsSL --connect-timeout 8 --max-time 45 \
                   -o "$dest" "$base/texgyrepagella-$face.otf" \
                 && [ -s "$dest" ] \
                 && [ "$(head -c 4 "$dest" | tr -d '\0')" = "OTTO" ]; then
                got="$base"; break
              fi
              echo "mirror failed for $face: $base"
            done
            [ -n "$got" ] || { echo "no mirror served texgyrepagella-$face.otf"; exit 1; }
          done
          fc-cache -f

          if ! command -v tectonic >/dev/null; then
            curl -fsSL --retry 2 --retry-delay 3 --connect-timeout 10 \
              https://drop-sh.fullyjustified.net | sh
            sudo mv tectonic /usr/local/bin/
          fi

          pandoc --version | head -1
          tectonic --version
          fc-list | grep -qi 'TeX Gyre Pagella' \
            || { echo 'TeX Gyre Pagella missing; the PDF builds will fail'; exit 1; }

      # The gate requires each derived report to be at least as new as the caches it
      # summarises, and a fresh clone gives them all one timestamp. All three read existing
      # caches and take under a second between them.
      - name: Regenerate the derived reports
        run: |
          python tools/inventory_model_choices.py
          python tools/summarize_release_gate.py
          python tools/summarize_robustness.py

      # One retry each: every tectonic failure seen here has been a transient fetch, and a
      # second run reuses whatever the first retrieved.
      - name: Build the primer, the book and the paper
        run: |
          python tools/build_primer.py || python tools/build_primer.py
          python tools/build_book.py   || python tools/build_book.py
          cd paper
          tectonic anonymity-as-an-aggregation-condition.tex \
            || tectonic anonymity-as-an-aggregation-condition.tex

      - name: No text may sit outside the type block
        run: |
          python - <<'PY'
          import pathlib, re, sys
          bad = False
          for name, log in (("book", "build/pandoc.log"),
                            ("primer", "build/primer-pandoc.log")):
              path = pathlib.Path(log)
              if not path.exists():
                  continue
              hits = sorted({ln.strip() for ln in path.read_text(errors="ignore").splitlines()
                             if re.search(r"Overfull .hbox \(\d+\.?\d*pt", ln)})
              print(f"{name}: {len(hits)} overfull boxes")
              for hit in hits:
                  print("    " + hit)
              bad |= bool(hits)
          sys.exit(1 if bad else 0)
          PY

      - name: Full release gate and the slow integration tests
        env:
          NIC_SLOW_TESTS: "1"
        run: |
          python tools/check_release.py
          python -m pytest tests/test_tools_integration.py
