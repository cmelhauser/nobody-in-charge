# Raises the commit-hash pins in .github/workflows by pull request. Each action is pinned
# to a SHA with its version in a trailing comment; Dependabot updates both together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
