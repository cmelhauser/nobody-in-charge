# Type-check configuration. Run both of these from the repository root:
#
#   mypy --disallow-untyped-defs tools
#   mypy tests
#
# tools/ must be fully annotated (every function has parameter and return types); tests/ is
# checked for type errors in the bodies of its functions but is not required to annotate them,
# because a test function's parameters are pytest fixtures and its return is always None.
#
# model/ is not checked. The canonical model and the analysis scripts are hash-frozen, so
# adding an annotation to one would change the SHA-256 that every cache records.
[mypy]
python_version = 3.11
mypy_path = tools:model
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
ignore_missing_imports = True

# The tests import the canonical model and a few analysis scripts. Their types are used but their
# own errors are not reported: they are hash-frozen, so a fix would change the SHA-256 their caches record.
[mypy-aa_group_model,ch13_reps,ch14_individual,ch14_sweep,ch15_service,core_thresholds,decay_ordering,decay_reversal,elicitation_compare,mc_error,morris_screen,part2_influence,part5_runs,release_gate_analysis,resource_list_test,scenarios_hiseed,sensitivity_oat_full,sensitivity_tiered,sensitivity_uniform,sobol_indices,structural_variants,tradition_paired]
follow_imports = silent
